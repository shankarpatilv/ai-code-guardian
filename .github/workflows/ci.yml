name: CI

on:
  push:
    branches: [ main, develop, 'phase*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Run tests
      run: npm test
      env:
        CI: true

    - name: Check linting
      run: npm run lint
      continue-on-error: true

    - name: Check TypeScript types
      run: npm run typecheck
      continue-on-error: true

    - name: Test analyzer CLI
      run: |
        echo "console.log('test');" | node dist/cli.js analyze --stdin --language javascript --format json

    - name: Test hook script
      run: |
        chmod +x hooks/analyze.sh
        bash hooks/analyze.sh --tool Write --file test.js --content "const x = 1;"
      env:
        GUARDIAN_DEBUG: true

  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check for sensitive files
      run: |
        if find . -name "*.env" -o -path "*/.claude/memories/*" | grep -q .; then
          echo "❌ Sensitive files found that shouldn't be committed"
          exit 1
        fi
        echo "✅ No sensitive files detected"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run security audit
      run: npm audit --audit-level=moderate
      continue-on-error: true

  build-artifacts:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build production
      run: npm run build

    - name: Check bundle size
      run: |
        echo "Bundle size report:"
        du -sh dist/*

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-node20
        path: dist/
        retention-days: 7